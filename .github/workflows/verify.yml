# Runs both Brutality formal proof suites on every push/PR
# No proprietary EFT/SPT DLLs are needed: CI compiles and runs the actual C# plugin sources directly.
name: Brutality Formal Proofs

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    name: Delirium & Kinematics (77 tests)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Verify Forge plugin metadata (GUID & version sync)
        run: |
          csproj_ver=$(grep -oP '(?<=<Version>)[^<]+' src/Brutality/Brutality.csproj)
          plugin_ver=$(grep -oP 'public const string Version = "\K[^"]+' src/Brutality/Plugin.cs)
          plugin_guid=$(grep -oP 'public const string Guid = "\K[^"]+' src/Brutality/Plugin.cs)
          echo "GUID: $plugin_guid | csproj: $csproj_ver | Plugin.cs: $plugin_ver"
          test -n "$plugin_guid"
          test "$csproj_ver" = "$plugin_ver"

      - name: Run Delirium proofs (31 tests)
        run: dotnet run --project tests/Brutality.DeliriumTests -c Release -- --report docs/VERIFICATION.md

      - name: Run Kinematics & Anatomy proofs (46 tests)
        run: dotnet run --project tests/Brutality.KinematicsTests -c Release -- --append-report docs/VERIFICATION.md

      - name: Publish proof report in workflow summary
        run: cat docs/VERIFICATION.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload docs/VERIFICATION.md artifact
        uses: actions/upload-artifact@v4
        with:
          name: brutality-verification-report
          path: docs/VERIFICATION.md
          retention-days: 90
