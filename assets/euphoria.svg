      <stop offset="0%" stop-color="#181b20"/>
      <stop offset="100%" stop-color="#101216"/>
    </linearGradient>
    <linearGradient id="euph-accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ff8a00"/>
