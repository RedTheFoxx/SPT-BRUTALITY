  <text x="61" y="49" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9" font-weight="500" letter-spacing="0.8" fill="#9ca3af">NATURALMOTION · DELIRIUM</text>
